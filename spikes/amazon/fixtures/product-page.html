<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Amazon product fixture</title>
  </head>
  <body>
    <main>
      <input id="ASIN" type="hidden" value="B092LVTSD4" />
      <h1 id="productTitle">Fixture Storage Bin</h1>
      <div id="variation_color_name">Color: <span class="selection">Grey</span></div>
      <div id="variation_size_name">Size: <span class="selection">17 x 13 x 13 in</span></div>
      <img id="landingImage" data-old-hires="https://example.test/main.jpg" src="https://example.test/main-small.jpg" />
      <ul id="altImages">
        <li><img data-old-hires="https://example.test/alternate.jpg" src="https://example.test/alternate-small.jpg" /></li>
      </ul>
      <ul id="feature-bullets">
        <li><span>Stackable storage solution</span></li>
        <li><span>Durable plastic construction</span></li>
      </ul>
      <span class="a-price"><span class="a-offscreen">$19.99</span></span>
      <table id="productDetails_techSpec_section_1">
        <tbody><tr><th>Brand</th><td>Fixture Co.</td></tr></tbody>
      </table>
      <table id="productDetails_detailBullets_sections1">
        <tbody><tr><th>Material</th><td>Plastic</td></tr></tbody>
      </table>
    </main>
    <section id="reviews-medley-footer">
      <img src="https://example.test/review.jpg" alt="Buyer review photo" />
    </section>
  </body>
</html>
